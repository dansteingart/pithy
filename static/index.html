<script>

//setup

const ydoc = new Y.Doc()
const wsProvider = new WebsocketProvider(window.location.origin.replace("http","ws"), code_name, ydoc)
wsProvider.on('status', event => {
  console.log(event.status)
  if (event.status == "connected")
  {
    check_running();
    setTimeout(()=>{ check_exists(); history(); }, 500);
    $("#status").html("connected")

    editor.updateOptions({ readOnly: false })
    editor.focus();
  }
  else if (event.status == "disconnected") 
  {
    editor.updateOptions({ readOnly: true }) 
    $("#status").html("<span style='color:red'>Disconnected</span> ")

  }

})




function steaksauce()
{
      // Get the current cursor position
      const position = editor.getPosition();
      const selection = editor.getSelection();
      editor.executeEdits("", [{
        range: new monaco.Range(position.lineNumber+1, 0, position.lineNumber+1, 0),
        text: `\n# working please wait...`,
        forceMoveMarkers: true  }]);  

      editor.updateOptions({ readOnly: true });
      // Retrieve the selected text using the model
      const selectedText = editor.getModel().getValueInRange(selection);

      $.post("/steaksauce/",json={'ask':selectedText}).then((data)=>{
        editor.updateOptions({ readOnly: false });  
      //   editor.executeEdits("", [{
      //   range: new monaco.Range(position.lineNumber+1, 0, position.lineNumber+1, 0),
      //   text: `\n${data['code']}`,
      //   forceMoveMarkers: true
      // }]);  
        // Get the model from the editor
        const model = editor.getModel();

        // Find all matches of the text you want to replace
        const matches = model.findMatches('# working please wait...', true, false, false, null, true);

        // Prepare replacement edits for each match
        const edits = matches.map(match => {
          return {
            range: match.range,
            text: data['code'],
          };
    });

    // Apply all the edits at once
    editor.executeEdits('replace-all', edits);
      
    })

  // Create an edit operation
}



//Setup and Bind CM
const yCm = ydoc.getText('codemirror')
// const yUndoManager = new Y.UndoManager(yCm)
//const binding = new CodemirrorBinding(yCm, editor, wsProvider.awareness, { yUndoManager })
const binding = new MonacoBinding(yCm, /** @type {monaco.editor.ITextModel} */ (editor.getModel()), new Set([editor]), wsProvider.awareness)

//setup and bind output pane
const yO = ydoc.getText(code_name+'_output')
yO.observe(event => {
  $("#output").html(yO.toString());
})

//set flags to mark running
const ykeys = ydoc.getMap(cdk)
ykeys.observe(event =>{
  if (ykeys.get('running') == true) 
  {
    $("#run").prop("disabled",true);
    $("#status").html(`running for ${(ykeys.get("runtime")/1000).toFixed(2)} s`);
  }
  else 
  {
    $("#run").prop("disabled",false);
    if (ykeys.get("runtime") > 0) 
    {
      if  (ykeys.get("killed")) $("#status").html(`killed at ${(ykeys.get("runtime")/1000).toFixed(2)} s`);
      else if (ykeys.get("exit_code")==124) $("#status").html(`timeout at ${(ykeys.get("runtime")/1000).toFixed(2)} s`)
      else $("#status").html(`finished after ${(ykeys.get("runtime")/1000).toFixed(2)} s`);
    }

  }

} )

//check to see if code is running and match up codes
function check_running()
{
  $.post("/check_running/",{'code':code_name}, function(data)
  {
    ykeys.set('running',data['running']);
    console.log(data);
  })
}

function check_exists()
{
  $.post("/check_exists/",{'code':code_name}, function(data)
  {
    console.log(data);
  })
}

$("#copyto").click(function(){
	forkcode();
});

function forkcode(){
	var marker = window.prompt("Copy This Code As:",code_name+"_copy");
	if (marker != null & marker != "")
	{
		$.post("/copy_code/",
		  {code:code_name,copy_to:marker},
		  function(data){
        if (data['status'] == "success")  window.location.href = data['new_code'];
        else alert(data['status'])
			}
		)
	}
	

	
}


//rest of code!
waiting = false;
function run()
{
  //ykeys.set('running',true);
  payload = {'code':code_name};
  if (($("#run").prop("disabled") == false) & (waiting == false))
  {
    waiting = true;
    $("#status").html("wait a sec")

    $.post('/run/',payload,(data) => {
      waiting = false;
      console.log(data)
      history()
    });
  }
  else {console.log("HOLD YOUR HORSES")}
}
$("#run").click(function(){run()});

function kill()
{
  payload = {'code':code_name};
  $.post('/kill/',payload,function(data){console.log(data)});
}

//screen states
sStates = 0 ; //0 = 50/50 , 1 = all code 2 = all output
function all_code()
{
  $("#editor").css("width","100%")
  $("#resizer").hide()
  $("#right").css({"left":"100%","width":"0%"})
}

function all_output()
{
  $("#editor").css("width","0%")
  $("#resizer").hide()
  $("#right").css({"left":"0%","width":"100%"})
}

function split_5050()
{
  $("#editor").css("width","calc(50% - 3px)")
  $("#resizer").show().css("left","50%")
  $("#right").css({"left":"calc(50% + 3px)","width":"calc(50% - 3px)"})
}

function toggle_states()
{
  sStates +=1;
  if (sStates > 2) sStates = 0
  if      (sStates == 1) all_code(); 
  else if (sStates == 2) all_output();
  else if (sStates == 0) split_5050();
}

function resizer5000(dir)
{
  ew = $("#editor").width()
  ow = $("#right").width()

  $("#editor").width(ew-dir)
  $("#right").width(ow+dir)

}

function resizerm(w)
{
  const pct = (w / window.innerWidth) * 100;
  $("#editor").css("width", `calc(${pct}% - 3px)`);
  $("#resizer").css("left", `${pct}%`);
  $("#right").css({"left": `calc(${pct}% + 3px)`, "width": `calc(${100-pct}% - 3px)`});
}

//Cursor colors
const cursorColors = ['#e06c75','#61afef','#c678dd','#e5c07b','#56b6c2','#98c379','#d19a66','#be5046'];
function userColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = ((h << 5) - h + name.charCodeAt(i)) | 0;
  return cursorColors[Math.abs(h) % cursorColors.length];
}

//Cursor Set
user = "";
$.post("/get_user/",function(data){
  user=data['user'];
  const color = userColor(user);
  binding.awareness.setLocalStateField('user', { color: color, name: user });
})

// Dynamic cursor labels
const cursorStyleEl = document.createElement('style');
document.head.appendChild(cursorStyleEl);

binding.awareness.on('change', () => {
  let css = '';
  binding.awareness.getStates().forEach((state, clientID) => {
    if (clientID === ydoc.clientID) return;
    if (!state.user) return;
    const c = state.user.color || '#888';
    const name = state.user.name || '?';
    const escaped = name.replace(/'/g, "\\'");
    css += `
      .yRemoteSelection-${clientID} { background-color: ${c}; }
      .yRemoteSelectionHead-${clientID} {
        border-left: ${c} solid 2px;
      }
      .yRemoteSelectionHead-${clientID}::after {
        content: '${escaped}';
        position: absolute;
        background: ${c};
        color: white;
        font-size: 10px;
        font-family: Helvetica, sans-serif;
        padding: 1px 4px;
        border-radius: 3px;
        left: -2px;
        top: -18px;
        white-space: nowrap;
        pointer-events: none;
        z-index: 100;
      }
    `;
  });
  cursorStyleEl.textContent = css;
})


function history(){
  $.post("/history/",{'code':code_name},(data)=>{
    const out = data['history'] || []
    if (out.length > 1)
    {
      let selecters = "<select id='histories' class='selectig'>"
      for (const entry of out)
      {
          const ts = entry[0]
          const label = new Date(ts).toLocaleString('en-US', {month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit'})
          selecters += `<option value="${ts}">${label}</option>`
      }
      selecters += "</select>"
      $("#history_box").html("history:"+selecters)
      $("#histories").change(function(){get_data()})
    }
  });
}

function get_data(){
	val = $("#histories").val();
  $.post("/get_history/",{'code':code_name,'history':val},(data)=>{console.log(data);})
}
